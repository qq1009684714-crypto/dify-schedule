name: auto run
on:
  schedule:
    - cron: '0 1 * * 0'  # 北京时间周日 9:00 对应 UTC 1:00
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run script
        env:
          DIFY_TOKENS: ${{ secrets.DIFY_TOKENS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        # q_dify_workflow.js
        run: node ./workflow/dify.js
