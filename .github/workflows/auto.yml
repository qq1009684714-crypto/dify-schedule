name: auto run
on:
  schedule:
    - cron: '0 1 * * 0'  # 北京时间周日 9:00 对应 UTC 1:00
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run script
        env:
          DIFY_TOKENS: ${{ secrets.DIFY_TOKENS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        # 改用 workflow 文件夹里的 dify.js，路径明确存在
        run: node ./workflow/dify.js
