name: auto run
on:
  schedule:
    - cron: '0 1 * * 0'  # 北京时间周日 9:00 对应 UTC 1:00
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'  # 缓存依赖，加快运行速度

      - name: Install dependencies
        run: |
          npm ci  # 比 npm install 更稳定，使用 package-lock.json 精确安装

      - name: Run dify.js script
        env:
          DIFY_TOKENS: ${{ secrets.DIFY_TOKENS }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: node ./dify.js
