name: auto run
on:
  schedule:
    - cron: '0 1 * * 1'  # 北京时间周一 9:00 对应 UTC 1:00
  workflow_dispatch:      # 允许手动点击运行

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install rss-parser axios  # 自动安装需要的依赖

      - name: Run script
        env:
          DIFY_API_KEY: ${{ secrets.DIFY_API_KEY }}  # 注意：这里改成DIFY_API_KEY，更标准
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
       run: node ./workflow/dify.cjs
